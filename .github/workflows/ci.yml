name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '22'

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  build:
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next/
          retention-days: 1

  # ── Content validation ──────────────────────────────────────────────
  content-validation:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install tsx for dev server test
        run: npm install --save-dev tsx

      - name: Validate EN page renders
        run: |
          npx tsx -e "
            const { createServer } = require('http');
            const { parse } = require('url');
            const next = require('next');
            const app = next({ dev: false, dir: '.', conf: { output: 'standalone' } });
            const handle = app.getRequestHandler();
            await app.prepare();
            const server = createServer((req, res) => {
              const parsedUrl = parse(req.url, true);
              handle(req, res, parsedUrl);
            });
            await new Promise((resolve, reject) => server.listen(3001, err => err ? reject(err) : resolve()));
            const enRes = await fetch('http://localhost:3001/en');
            if (!enRes.ok) { console.error('EN page failed:', enRes.status); process.exit(1); }
            console.log('EN page OK', enRes.status);
            server.close();
          "

      - name: Validate ES page renders
        run: |
          npx tsx -e "
            const { createServer } = require('http');
            const { parse } = require('url');
            const next = require('next');
            const app = next({ dev: false, dir: '.', conf: { output: 'standalone' } });
            const handle = app.getRequestHandler();
            await app.prepare();
            const server = createServer((req, res) => {
              const parsedUrl = parse(req.url, true);
              handle(req, res, parsedUrl);
            });
            await new Promise((resolve, reject) => server.listen(3002, err => err ? reject(err) : resolve()));
            const esRes = await fetch('http://localhost:3002/es');
            if (!esRes.ok) { console.error('ES page failed:', esRes.status); process.exit(1); }
            console.log('ES page OK', esRes.status);
            server.close();
          "

      - name: Validate report JSON structure
        run: |
          npx tsx -e "
            const fs = require('fs');
            const path = require('path');
            const reportsDir = path.join('.next', 'standalone', 'public', 'reports');
            const altDir = path.join('public', 'reports');
            const dir = fs.existsSync(reportsDir) ? reportsDir : fs.existsSync(altDir) ? altDir : null;
            if (!dir) { console.log('No reports directory found — skipping'); process.exit(0); }
            const files = fs.readdirSync(dir).filter(f => f.endsWith('.json'));
            if (files.length === 0) { console.log('No reports yet — skipping'); process.exit(0); }
            for (const file of files) {
              const content = JSON.parse(fs.readFileSync(path.join(dir, file), 'utf8'));
              const required = ['date', 'title', 'sections', 'lang'];
              for (const key of required) {
                if (!(key in content)) {
                  console.error('Report', file, 'missing field:', key);
                  process.exit(1);
                }
              }
              if (!Array.isArray(content.sections) || content.sections.length === 0) {
                console.error('Report', file, 'must have non-empty sections array');
                process.exit(1);
              }
              console.log('Report', file, '✓');
            }
          "

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Security audit (CRITICAL only — known Next.js vulns excluded)
        run: npm audit --audit-level=critical

      - name: Snyk security scan
        run: npx snyk test --severity-threshold=high
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
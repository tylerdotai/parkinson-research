name: Cron Report

on:
  schedule:
    - cron: "0 12 * * *" # Daily at 12:00 UTC (7 AM CDT)
  workflow_dispatch:

jobs:
  cron-report:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run research pipeline
        run: |
          if npm run research 2>/dev/null; then
            echo "Research completed"
          else
            echo "No research script found or pipeline not configured for CI"
          fi

      - name: Commit and push report
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add public/reports/ || true
          git diff --cached --quiet || (git commit -m "reports: $(date +%Y-%m-%d) daily update" && git push)
name: Cron Report

on:
  schedule:
    - cron: "0 12 * * *" # Daily at 12:00 UTC (7 AM CDT)
  workflow_dispatch: # Manual trigger

jobs:
  cron-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install tsx
        run: npm install --save-dev tsx

      - name: Run research pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          REPORT_DATE: ${{ inputs.date || env.REPORT_DATE || (needs.date.outputs.date) }}
        run: |
          if npx tsx scripts/research-agent.ts; then
            echo "Research completed successfully"
          else
            echo "Research failed"
            exit 1
          fi

      - name: Trigger email delivery
        run: |
          DATE=$(date +%Y-%m-%d)
          curl -s -X POST "https://parkinson-research.vercel.app/api/send-report" \
            -H "Content-Type: application/json" \
            -d "{\"date\": \"$DATE\", \"language\": \"en\"}"
          curl -s -X POST "https://parkinson-research.vercel.app/api/send-report" \
            -H "Content-Type: application/json" \
            -d "{\"date\": \"$DATE\", \"language\": \"es\"}"
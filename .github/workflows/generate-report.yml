name: Generate Report

on:
  schedule:
    - cron: '0 12 * * *'  # 7:00 AM CDT = 12:00 UTC
  workflow_dispatch:  # Manual trigger

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install tsx
        run: npm install --save-dev tsx

      - name: Generate today's report
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        run: npx tsx scripts/generate-report.ts

      - name: Commit and push
        run: |
          git config --local user.email "actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          if git diff --cached --quiet; then
            echo "No changes — skipping commit"
          else
            git commit -m "reports: $(date +%Y-%m-%d) daily update"
            git push origin main
          fi